name: Merkle
description: 'Merkle Data is a risk-management and analytics platform for crypto institutions, founded
  in 2017 and headquartered in New York. The platform aggregates proprietary market data (its Pulse
  dataset), public blockchain data, and third-party feeds to give funds, trading desks, and other
  digital-asset institutions actionable analytics across portfolio risk, liquidity risk, and
  counterparty risk, delivered through both interactive dashboards and programmatic APIs. Merkle Data
  is backed by Pantera Capital. As of this enrichment pass no public developer portal, API reference,
  or SDK is discoverable and merkledata.io resolves to a login-gated institutional dashboard, so this
  record captures identity only.'
